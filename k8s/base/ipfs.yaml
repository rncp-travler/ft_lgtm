# kubo node. The RPC API (5001) stays cluster-internal; only the
# read-only gateway (8080) is exposed through the Ingress.
#
# start_ipfs runs every /container-init.d/*.sh on each start, not just on the
# first one, so this also reaches an already initialised volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipfs-init
  namespace: lgtm
data:
  01-gateway.sh: |
    #!/bin/sh
    set -e
    # Declare the Ingress hostname as a path gateway. Without it kubo treats an
    # unknown Host as a possible DNSLink name, and every request blocks on a TXT
    # lookup for _dnslink.ipfs.lgtm.local that never resolves: ~10s per request.
    ipfs config --json Gateway.PublicGateways '{
      "ipfs.lgtm.local": {
        "Paths": ["/ipfs", "/ipns"],
        "UseSubdomains": false,
        "NoDNSLink": true
      }
    }'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipfs
  namespace: lgtm
  labels: { app: ipfs }
spec:
  serviceName: ipfs
  replicas: 1
  selector:
    matchLabels: { app: ipfs }
  template:
    metadata:
      labels: { app: ipfs }
    spec:
      containers:
        - name: kubo
          image: ipfs/kubo:v0.43.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: swarm, containerPort: 4001 }
            - { name: api, containerPort: 5001 }
            - { name: gateway, containerPort: 8080 }
          env:
            - { name: IPFS_PROFILE, value: server }
            # Bind the API to all interfaces so the backend Service can reach it.
            - { name: IPFS_API_ADDR, value: "/ip4/0.0.0.0/tcp/5001" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/ipfs }
            - { name: init, mountPath: /container-init.d }
          readinessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 10
      volumes:
        - name: init
          configMap:
            name: ipfs-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs
  namespace: lgtm
spec:
  selector: { app: ipfs }
  ports:
    - { name: api, port: 5001, targetPort: api }
    - { name: gateway, port: 8080, targetPort: gateway }
    - { name: swarm, port: 4001, targetPort: swarm }
