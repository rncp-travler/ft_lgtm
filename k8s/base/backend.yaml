apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lgtm
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: ft_lgtm/backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: OTEL_SERVICE_NAME, value: lgtm-backend }
            - {
                name: OTEL_EXPORTER_OTLP_ENDPOINT,
                value: "http://otel-collector.observability.svc.cluster.local:4317",
              }
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            - {
                name: OTEL_RESOURCE_ATTRIBUTES,
                value: "service.namespace=ft_lgtm,deployment.environment=local",
              }
            - { name: IPFS_API_URL, value: "http://ipfs:5001" }
            - { name: IPFS_GATEWAY_URL, value: "http://ipfs.lgtm.local" }
            - { name: EXEC_TIMEOUT, value: "5s" }
            - { name: MEMORY_LIMIT_BYTES, value: "10485760" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            # rustc is the hungry part of the pipeline, not the sandbox.
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
      volumes:
        # Compile/run scratch space, so the root filesystem can stay read-only.
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lgtm
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
