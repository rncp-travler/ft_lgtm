# grafana/mimir-distributed chart 6.2.0 (Mimir 3.2.x), scaled down to fit a
# laptop cluster: one replica per component, no zone-aware replication.
# Metrics arrive from the Collector over OTLP (/otlp/v1/metrics).
mimir:
  structuredConfig:
    multitenancy_enabled: false
    limits:
      # Exemplars are the Metric -> Trace jump in Grafana; without this they
      # are dropped on ingest.
      max_global_exemplars_per_user: 100000
      native_histograms_ingestion_enabled: true
      compactor_blocks_retention_period: 168h

# Object storage for blocks (local MinIO, not for production).
minio:
  enabled: true
  replicas: 1
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }

gateway:
  enabled: true
  replicas: 1

distributor: { replicas: 1 }
querier: { replicas: 1 }
query_frontend: { replicas: 1 }
query_scheduler: { replicas: 1 }
compactor: { replicas: 1 }

ingester:
  replicas: 1
  zoneAwareReplication: { enabled: false }
  persistentVolume: { size: 10Gi }

store_gateway:
  replicas: 1
  zoneAwareReplication: { enabled: false }
  persistentVolume: { size: 10Gi }

# Not needed for this project.
alertmanager: { enabled: false }
ruler: { enabled: false }
rollout_operator: { enabled: false }

metaMonitoring:
  serviceMonitor:
    enabled: false
