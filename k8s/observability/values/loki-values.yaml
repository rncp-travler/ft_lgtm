# grafana/loki chart 7.3.0 (Loki 3.6.x), single-binary mode for a local cluster.
# Logs arrive from the Collector over OTLP (/otlp/v1/logs).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Required so OTLP trace_id/span_id land as structured metadata,
    # which is what the Loki -> Tempo data link uses.
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# Unused in single-binary mode.
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

gateway:
  enabled: true
  replicas: 1

chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
